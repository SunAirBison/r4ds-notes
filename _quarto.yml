project:
  type: book
  output-dir: _book

execute:
  freeze: auto

book:
  title: Notebook
  subtitle: R for Data Science (2e)
  reader-mode: true
  sidebar:
    style: "docked"

  chapters:
    - index.qmd
    - part: "Data Visualization"
      chapters:
        - 01-data-visualization/02-first-steps.qmd
        - 01-data-visualization/04-visualizing-distributions.qmd
        - 01-data-visualization/05-visualizing-relationships.qmd
    - part: "Tests"

  appendices:
    - progress.md

format:
  html:
    callout-icon: false
    number-sections: false

render:
  - "!LICENSE"
  - "!readme.md"
