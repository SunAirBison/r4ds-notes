project:
  type: book
  output-dir: _book

execute:
  freeze: auto

book:
  title: Notebook
  subtitle: R for Data Science (2e)
  reader-mode: true
  sidebar:
    style: "docked"

  chapters:
    - index.qmd
    - part: "Data Visualization"
      chapters:
        - whole-game/01-data-visualization/02-first-steps.qmd
        - whole-game/01-data-visualization/04-visualizing-distributions.qmd
        - whole-game/01-data-visualization/05-visualizing-relationships.qmd
        - whole-game/01-data-visualization/06-saving-plots.qmd

    - whole-game/02-workflow-basics.qmd

    - part: "Data Transformation"
      chapters:
        - whole-game/03-data-transformation/02-rows.qmd
        - whole-game/03-data-transformation/03-columns.qmd
        - whole-game/03-data-transformation/05-groups.qmd

    - whole-game/04-code-style.qmd
    - whole-game/05-data-tidying.qmd
    - whole-game/07-data-import.qmd

    - part: "Layers"
      chapters:
        - visualize/09-layers/02-aesthetics.qmd
        - visualize/09-layers/03-geometric-objects.qmd
        - visualize/09-layers/04-facets.qmd
        - visualize/09-layers/05-transformations.qmd
        - visualize/09-layers/06-position-adjustments.qmd

    - progress.md
format:
  html:
    callout-icon: false
    number-sections: false

render:
  - "!LICENSE"
  - "!readme.md"
